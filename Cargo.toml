[package]
name = "xia_display_adaptor"
version = "6.3.0"
edition = "2021"

[dependencies]
rsbinder = { version = "0.12", features = ["android_14_plus"] }
async-trait = "0.1"
libc = "0.2"
log = "0.4"

[build-dependencies]
rsbinder-aidl = "=0.12"

[lib]
name = "oplusbright"
path = "src/lib.rs"

[[bin]]
name = "xia_display_adaptor"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
